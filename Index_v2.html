<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サビメドレー自動作成メーカー</title>
  <style>
    :root {
      --primary-color: #1DB954;
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #282828;
      --hover-bg: #333333;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      resize: vertical;
    }
    .hint {
      font-size: 0.85rem;
      color: #b3b3b3;
      margin-bottom: 8px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: background-color 0.3s, transform 0.1s;
    }
    button:hover:not(:disabled) {
      background-color: #1ed760;
      transform: scale(1.02);
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
      color: #aaa;
    }
    .player-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .player-controls button {
      width: auto;
      margin: 0;
      padding: 10px 20px;
      min-width: 80px;
    }
    #now-playing {
      margin-top: 30px;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #now-playing img {
      width: 180px;
      height: 180px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      object-fit: cover;
    }
    #track-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 0 0 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #track-artist {
      font-size: 0.9rem;
      color: #b3b3b3;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-container {
      width: 100%;
      height: 4px;
      background-color: #444;
      border-radius: 2px;
      margin-top: 15px;
      cursor: pointer;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      border-radius: 2px;
      transition: width 0.1s linear;
    }
    
    .export-controls {
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .export-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #1DB954;
    }
    .checkbox-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #1DB954;
    }
    .export-btn {
      width: 100%;
      margin-top: 0;
      padding: 12px 15px;
      font-size: 1rem;
      background-color: #1DB954;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .playlist {
      margin-top: 20px;
    }
    .playlist-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #333;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .playlist-item:hover {
      background-color: var(--hover-bg);
    }
    .playlist-item.playing {
      background-color: #333;
      border-left: 4px solid var(--primary-color);
    }
    .item-checkbox {
      margin-right: 15px;
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #1DB954;
    }
    .playlist-item img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      margin-right: 15px;
      object-fit: cover;
      cursor: pointer;
    }
    .track-info {
      flex-grow: 1;
      overflow: hidden;
      cursor: pointer;
    }
    .track-info .title {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist {
      font-size: 0.8rem;
      color: #b3b3b3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-error {
      font-size: 0.8rem;
      color: #ff4d4d;
    }
    #statusMessage {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>サビメドレー自動作成</h1>
  
  <p class="hint">曲名を1行ずつ入力してください。<br>（例：八月の花火 紫 今）</p>
  <textarea id="songInput" placeholder="Lemon 米津玄師&#10;八月の花火 紫 今&#10;夜に駆ける"></textarea>
  
  <button id="generateBtn" onclick="generatePlaylist()">プレイリストを作成</button>
  
  <div id="statusMessage"></div>

  <div id="now-playing">
    <img id="artwork" src="" alt="Album Art">
    <h2 id="track-title">曲名</h2>
    <p id="track-artist">アーティスト名</p>
    
    <div class="progress-container" id="progressContainer" onclick="seek(event)">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="player-controls">
      <button onclick="prevSong()">前へ</button>
      <button id="playPauseBtn" onclick="togglePlay()">一時停止</button>
      <button onclick="nextSong()">次へ</button>
    </div>
  </div>

  <div class="export-controls" id="exportControls">
    <div class="export-top">
      <label class="checkbox-label">
        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()"> すべて選択
      </label>
      <span style="font-size: 0.8rem; color: #aaa;">チェックした曲をSpotify等へ</span>
    </div>
    <button class="export-btn" onclick="exportSelected()">
      📋 変換ツールへ転送（コピーして開く）
    </button>
  </div>

  <div class="playlist" id="playlist-container"></div>
</div>

<script>
  let playlist = [];
  let currentIndex = 0;
  const audio = new Audio();
  
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const progressPercent = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progressBar').style.width = progressPercent + '%';
    }
  });

  audio.addEventListener('ended', () => {
    nextSong();
  });

  function seek(event) {
    const container = document.getElementById('progressContainer');
    const rect = container.getBoundingClientRect();
    const clickRatio = (event.clientX - rect.left) / rect.width;
    if (audio.duration) {
      audio.currentTime = clickRatio * audio.duration;
    }
  }

  function parseQuery(rawQuery) {
    const parts = rawQuery.trim().split(/\s+/);
    if (parts.length > 1) {
      const artist = parts.pop();
      const title = parts.join(' ');
      return { original: rawQuery, title: title, artist: artist };
    }
    return { original: rawQuery, title: rawQuery, artist: '' };
  }

  async function fetchWithRetry(url, maxRetries = 3) {
    let waitTime = 2000; 
    for (let i = 0; i < maxRetries; i++) {
      try {
        const response = await fetch(url);
        if (response.status === 403 || response.status === 429) {
          console.warn(`API制限を検知。${waitTime/1000}秒待機して再試行します...`);
          await new Promise(resolve => setTimeout(resolve, waitTime));
          waitTime *= 2; 
          continue;
        }
        if (!response.ok) throw new Error('HTTP status ' + response.status);
        return await response.json();
      } catch (error) {
        if (i === maxRetries - 1) throw error; 
        await new Promise(resolve => setTimeout(resolve, waitTime));
        waitTime *= 2;
      }
    }
    throw new Error('Retries failed');
  }

  async function generatePlaylist() {
    const inputText = document.getElementById('songInput').value;
    const lines = inputText.split('\n').filter(line => line.trim() !== '');
    
    if (lines.length === 0) {
      alert("曲名を入力してください。");
      return;
    }

    const generateBtn = document.getElementById('generateBtn');
    const statusMessage = document.getElementById('statusMessage');
    const playlistContainer = document.getElementById('playlist-container');
    const exportControls = document.getElementById('exportControls');
    
    generateBtn.disabled = true;
    playlistContainer.innerHTML = '';
    exportControls.style.display = 'none';
    
    playlist = new Array(lines.length);
    currentIndex = 0;
    
    audio.pause();
    document.getElementById('now-playing').style.display = 'none';

    const isLargeList = lines.length > 50;
    const concurrencyLimit = isLargeList ? 2 : 4; 
    const delayBetweenChunks = isLargeList ? 1500 : 300; 

    if (isLargeList) {
      statusMessage.textContent = "※大量の曲が入力されました。サーバー制限を回避するためゆっくり取得します...";
      await new Promise(resolve => setTimeout(resolve, 1500));
    }

    for (let i = 0; i < lines.length; i += concurrencyLimit) {
      const chunk = lines.slice(i, i + concurrencyLimit);
      const currentEnd = Math.min(i + concurrencyLimit, lines.length);
      statusMessage.textContent = `検索中... (${currentEnd}/${lines.length})`;

      const promises = chunk.map(async (rawQuery, chunkIndex) => {
        const globalIndex = i + chunkIndex;
        const parsed = parseQuery(rawQuery);
        
        try {
          const url = `https://itunes.apple.com/search?term=${encodeURIComponent(rawQuery)}&entity=song&country=jp&limit=15`;
          const data = await fetchWithRetry(url, 3);

          if (data.results && data.results.length > 0) {
            let selectedTrack = null;
            if (parsed.artist) {
              selectedTrack = data.results.find(t => 
                t.trackName.toLowerCase().includes(parsed.title.toLowerCase()) && 
                t.artistName.toLowerCase().includes(parsed.artist.toLowerCase())
              );
            }
            if (!selectedTrack) {
              selectedTrack = data.results.find(t => 
                t.trackName.toLowerCase().includes(parsed.title.toLowerCase()) ||
                t.trackName.toLowerCase().includes(rawQuery.toLowerCase())
              );
            }
            if (!selectedTrack) selectedTrack = data.results[0];

            if (selectedTrack.previewUrl) {
              playlist[globalIndex] = {
                originalQuery: rawQuery,
                title: selectedTrack.trackName,
                artist: selectedTrack.artistName,
                previewUrl: selectedTrack.previewUrl,
                artwork: selectedTrack.artworkUrl100.replace('100x100bb', '300x300bb'),
                found: true
              };
            } else {
               playlist[globalIndex] = { originalQuery: rawQuery, title: rawQuery, artist: 'プレビュー音源なし', found: false };
            }
          } else {
            playlist[globalIndex] = { originalQuery: rawQuery, title: rawQuery, artist: '見つかりませんでした', found: false };
          }
        } catch (error) {
          playlist[globalIndex] = { originalQuery: rawQuery, title: rawQuery, artist: '通信エラー', found: false };
        }
      });

      await Promise.all(promises);
      await new Promise(resolve => setTimeout(resolve, delayBetweenChunks));
    }

    playlist = playlist.filter(item => item !== undefined);

    statusMessage.textContent = "プレイリストの作成が完了しました！";
    generateBtn.disabled = false;
    
    renderPlaylist();

    if (playlist.some(track => track.found)) {
      exportControls.style.display = 'flex';
      document.getElementById('selectAllCheckbox').checked = false;
    }

    const firstPlayableIndex = playlist.findIndex(track => track.found);
    if (firstPlayableIndex !== -1) {
      document.getElementById('now-playing').style.display = 'block';
      playSong(firstPlayableIndex);
    } else {
      statusMessage.textContent = "再生できる曲が見つかりませんでした。";
    }
  }

  function renderPlaylist() {
    const container = document.getElementById('playlist-container');
    container.innerHTML = '';
    
    playlist.forEach((track, index) => {
      const item = document.createElement('div');
      item.className = `playlist-item ${index === currentIndex && track.found ? 'playing' : ''}`;
      item.id = `item-${index}`;
      
      if (track.found) {
        item.innerHTML = `
          <input type="checkbox" class="item-checkbox track-checkbox" value="${index}" onclick="event.stopPropagation()">
          <img src="${track.artwork}" alt="artwork" loading="lazy" onclick="playSong(${index})">
          <div class="track-info" onclick="playSong(${index})">
            <div class="title">${track.title}</div>
            <div class="artist">${track.artist}</div>
          </div>
        `;
      } else {
        item.innerHTML = `
          <input type="checkbox" class="item-checkbox" disabled>
          <div style="width:48px; height:48px; background:#444; border-radius:4px; margin-right:15px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#aaa;">No img</div>
          <div class="track-info">
            <div class="title">${track.title}</div>
            <div class="status-error">${track.artist}</div>
          </div>
        `;
      }
      container.appendChild(item);
    });
  }

  function toggleSelectAll() {
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const isChecked = selectAllCheckbox.checked;
    const checkboxes = document.querySelectorAll('.track-checkbox');
    checkboxes.forEach(cb => { cb.checked = isChecked; });
  }

  function exportSelected() {
    const checkboxes = document.querySelectorAll('.track-checkbox:checked');
    if (checkboxes.length === 0) {
      alert("転送する曲をチェックしてください。");
      return;
    }

    let exportText = "";
    checkboxes.forEach(cb => {
      const index = cb.value;
      const track = playlist[index];
      exportText += `${track.title} ${track.artist}\n`;
    });

    navigator.clipboard.writeText(exportText).then(() => {
      const userAction = confirm(`✅ 選択した ${checkboxes.length} 曲をコピーしました！\n\n【OK】を押すと、プレイリスト変換サイト(TuneMyMusic)が自動で開きます。\n\n開いた先の入力欄に「貼り付け」をして進めてください。`);
      if (userAction) {
        // 修正：URLをトップページに変更
        window.open('https://www.tunemymusic.com/', '_blank');
      }
    }).catch(err => {
      alert("コピーに失敗しました。ブラウザの権限設定をご確認ください。");
    });
  }

  function playSong(index) {
    if (index < 0 || index >= playlist.length || !playlist[index].found) return;
    const prevItem = document.getElementById(`item-${currentIndex}`);
    if (prevItem) prevItem.classList.remove('playing');

    currentIndex = index;
    const track = playlist[currentIndex];
    const currentItem = document.getElementById(`item-${currentIndex}`);
    if (currentItem) currentItem.classList.add('playing');

    document.getElementById('artwork').src = track.artwork;
    document.getElementById('track-title').textContent = track.title;
    document.getElementById('track-artist').textContent = track.artist;
    document.getElementById('progressBar').style.width = '0%';

    audio.src = track.previewUrl;
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        document.getElementById('playPauseBtn').textContent = '一時停止';
      }).catch(error => {
        document.getElementById('playPauseBtn').textContent = '再生';
      });
    }
  }

  function togglePlay() {
    const btn = document.getElementById('playPauseBtn');
    if (audio.paused) {
      audio.play();
      btn.textContent = '一時停止';
    } else {
      audio.pause();
      btn.textContent = '再生';
    }
  }

  function nextSong() {
    let nextIndex = currentIndex + 1;
    while (nextIndex < playlist.length && !playlist[nextIndex].found) {
      nextIndex++;
    }
    if (nextIndex < playlist.length) {
      playSong(nextIndex);
    } else {
      document.getElementById('playPauseBtn').textContent = '再生';
      document.getElementById('progressBar').style.width = '0%';
    }
  }

  function prevSong() {
    let prevIndex = currentIndex - 1;
    while (prevIndex >= 0 && !playlist[prevIndex].found) {
      prevIndex--;
    }
    if (prevIndex >= 0) {
      playSong(prevIndex);
    } else {
      audio.currentTime = 0;
      audio.play();
    }
  }
</script>

</body>
</html>
