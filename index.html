<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サビメドレー自動作成メーカー</title>
  <style>
    :root {
      --primary-color: #1DB954;
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #282828;
      --hover-bg: #333333;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      resize: vertical;
    }
    .hint {
      font-size: 0.85rem;
      color: #b3b3b3;
      margin-bottom: 8px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: background-color 0.3s, transform 0.1s;
    }
    button:hover:not(:disabled) {
      background-color: #1ed760;
      transform: scale(1.02);
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
      color: #aaa;
    }
    .player-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .player-controls button {
      width: auto;
      margin: 0;
      padding: 10px 20px;
      min-width: 80px;
    }
    #now-playing {
      margin-top: 30px;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #now-playing img {
      width: 180px;
      height: 180px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      object-fit: cover;
    }
    #track-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 0 0 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #track-artist {
      font-size: 0.9rem;
      color: #b3b3b3;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-container {
      width: 100%;
      height: 4px;
      background-color: #444;
      border-radius: 2px;
      margin-top: 15px;
      cursor: pointer;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      border-radius: 2px;
      transition: width 0.1s linear;
    }
    .playlist {
      margin-top: 30px;
    }
    .playlist-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #333;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .playlist-item:hover {
      background-color: var(--hover-bg);
    }
    .playlist-item.playing {
      background-color: #333;
      border-left: 4px solid var(--primary-color);
    }
    .playlist-item img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      margin-right: 15px;
      object-fit: cover;
    }
    .track-info {
      flex-grow: 1;
      overflow: hidden;
    }
    .track-info .title {
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist {
      font-size: 0.8rem;
      color: #b3b3b3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-error {
      font-size: 0.8rem;
      color: #ff4d4d;
    }
    #statusMessage {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
      min-height: 1.5em;
    }
  </style>
</head>
<body>


<div class="container">
  <h1>サビメドレー自動作成</h1>
  
  <p class="hint">曲名を1行ずつ入力してください。<br>※同名曲を避けるため「曲名 アーティスト名」での入力がおすすめです。（例：八月の花火 紫 今）</p>
  <textarea id="songInput" placeholder="Lemon 米津玄師&#10;八月の花火 紫 今&#10;夜に駆ける"></textarea>
  
  <button id="generateBtn" onclick="generatePlaylist()">プレイリストを作成</button>
  
  <div id="statusMessage"></div>


  <div id="now-playing">
    <img id="artwork" src="" alt="Album Art">
    <h2 id="track-title">曲名</h2>
    <p id="track-artist">アーティスト名</p>
    
    <div class="progress-container" id="progressContainer" onclick="seek(event)">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="player-controls">
      <button onclick="prevSong()">前へ</button>
      <button id="playPauseBtn" onclick="togglePlay()">一時停止</button>
      <button onclick="nextSong()">次へ</button>
    </div>
  </div>


  <div class="playlist" id="playlist-container"></div>
</div>


<script>
  let playlist = [];
  let currentIndex = 0;
  const audio = new Audio();
  
  // プログレスバーの更新
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const progressPercent = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progressBar').style.width = progressPercent + '%';
    }
  });


  // オーディオ終了時に次の曲へ進む
  audio.addEventListener('ended', () => {
    nextSong();
  });


  // シークバーのクリック処理
  function seek(event) {
    const container = document.getElementById('progressContainer');
    const rect = container.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const width = rect.width;
    const clickRatio = clickX / width;
    if (audio.duration) {
      audio.currentTime = clickRatio * audio.duration;
    }
  }


  // クエリのパース処理: 「曲名 アーティスト」のようにスペース区切りを想定
  function parseQuery(rawQuery) {
    const parts = rawQuery.trim().split(/\s+/);
    if (parts.length > 1) {
      // 最後の部分をアーティスト、それ以前を曲名として推測
      const artist = parts.pop();
      const title = parts.join(' ');
      return { original: rawQuery, title: title, artist: artist };
    }
    return { original: rawQuery, title: rawQuery, artist: '' };
  }


  // プレイリスト生成メイン処理
  async function generatePlaylist() {
    const inputText = document.getElementById('songInput').value;
    const lines = inputText.split('\n').filter(line => line.trim() !== '');
    
    if (lines.length === 0) {
      alert("曲名を入力してください。");
      return;
    }


    const generateBtn = document.getElementById('generateBtn');
    const statusMessage = document.getElementById('statusMessage');
    const playlistContainer = document.getElementById('playlist-container');
    
    generateBtn.disabled = true;
    playlistContainer.innerHTML = '';
    playlist = [];
    currentIndex = 0;
    
    // 再生中のものを止める
    audio.pause();
    document.getElementById('now-playing').style.display = 'none';


    for (let i = 0; i < lines.length; i++) {
      const rawQuery = lines[i];
      const parsed = parseQuery(rawQuery);
      statusMessage.textContent = `検索中... (${i + 1}/${lines.length}): ${rawQuery}`;
      
      try {
        // limit=15 に増やして、目的の曲が埋もれるのを防ぐ
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(rawQuery)}&entity=song&country=jp&limit=15`;
        const response = await fetch(url);
        const data = await response.json();


        if (data.results && data.results.length > 0) {
          let selectedTrack = null;
          
          // 最適化: アーティスト名と曲名の両方が部分一致するものを最優先で探す
          if (parsed.artist) {
            selectedTrack = data.results.find(t => {
              const trackNameLower = t.trackName.toLowerCase();
              const artistNameLower = t.artistName.toLowerCase();
              return trackNameLower.includes(parsed.title.toLowerCase()) && 
                     artistNameLower.includes(parsed.artist.toLowerCase());
            });
          }
          
          // 上記で見つからなかった場合、またはアーティスト指定がない場合は、曲名の一致だけで探す
          if (!selectedTrack) {
            selectedTrack = data.results.find(t => 
              t.trackName.toLowerCase().includes(parsed.title.toLowerCase()) ||
              t.trackName.toLowerCase().includes(rawQuery.toLowerCase()) // 元のクエリ全体での一致も試す
            );
          }
          
          // それでも見つからなければ、仕方なく1件目を採用（APIを信じる）
          if (!selectedTrack) {
            selectedTrack = data.results[0];
          }


          // プレビューURLが存在しない曲も稀にあるためチェック
          if (selectedTrack.previewUrl) {
            playlist.push({
              originalQuery: rawQuery,
              title: selectedTrack.trackName,
              artist: selectedTrack.artistName,
              previewUrl: selectedTrack.previewUrl,
              // 300x300の高解像度画像を取得
              artwork: selectedTrack.artworkUrl100.replace('100x100bb', '300x300bb'),
              found: true
            });
          } else {
             playlist.push({ originalQuery: rawQuery, title: rawQuery, artist: 'プレビュー音源なし', found: false });
          }


        } else {
          // 見つからなかった場合
          playlist.push({ originalQuery: rawQuery, title: rawQuery, artist: '見つかりませんでした', found: false });
        }
      } catch (error) {
        console.error("検索エラー:", error);
        playlist.push({ originalQuery: rawQuery, title: rawQuery, artist: '通信エラー', found: false });
      }
      
      // API制限対策
      await new Promise(resolve => setTimeout(resolve, 600));
    }


    statusMessage.textContent = "プレイリストの作成が完了しました！";
    generateBtn.disabled = false;
    renderPlaylist();


    // 最初に見つかった曲から再生をスタート
    const firstPlayableIndex = playlist.findIndex(track => track.found);
    if (firstPlayableIndex !== -1) {
      document.getElementById('now-playing').style.display = 'block';
      playSong(firstPlayableIndex);
    } else {
      statusMessage.textContent = "再生できる曲が見つかりませんでした。";
    }
  }


  // プレイリストのUI描画
  function renderPlaylist() {
    const container = document.getElementById('playlist-container');
    container.innerHTML = '';
    
    playlist.forEach((track, index) => {
      const item = document.createElement('div');
      item.className = `playlist-item ${index === currentIndex && track.found ? 'playing' : ''}`;
      item.id = `item-${index}`;
      
      if (track.found) {
        item.innerHTML = `
          <img src="${track.artwork}" alt="artwork" loading="lazy">
          <div class="track-info">
            <div class="title" onclick="playSong(${index})">${track.title}</div>
            <div class="artist">${track.artist}</div>
          </div>
        `;
      } else {
        item.innerHTML = `
          <div style="width:48px; height:48px; background:#444; border-radius:4px; margin-right:15px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#aaa;">No img</div>
          <div class="track-info">
            <div class="title">${track.title}</div>
            <div class="status-error">${track.artist}</div>
          </div>
        `;
      }
      container.appendChild(item);
    });
  }


  // 指定したインデックスの曲を再生
  function playSong(index) {
    if (index < 0 || index >= playlist.length || !playlist[index].found) return;


    const prevItem = document.getElementById(`item-${currentIndex}`);
    if (prevItem) prevItem.classList.remove('playing');


    currentIndex = index;
    const track = playlist[currentIndex];


    const currentItem = document.getElementById(`item-${currentIndex}`);
    if (currentItem) currentItem.classList.add('playing');


    document.getElementById('artwork').src = track.artwork;
    document.getElementById('track-title').textContent = track.title;
    document.getElementById('track-artist').textContent = track.artist;
    document.getElementById('progressBar').style.width = '0%';


    audio.src = track.previewUrl;
    
    // 再生処理（ブラウザの自動再生ブロック対策）
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        document.getElementById('playPauseBtn').textContent = '一時停止';
      }).catch(error => {
        console.log("自動再生がブロックされました:", error);
        document.getElementById('playPauseBtn').textContent = '再生';
      });
    }
  }


  // 再生・一時停止の切り替え
  function togglePlay() {
    const btn = document.getElementById('playPauseBtn');
    if (audio.paused) {
      audio.play();
      btn.textContent = '一時停止';
    } else {
      audio.pause();
      btn.textContent = '再生';
    }
  }


  // 次の曲へ
  function nextSong() {
    let nextIndex = currentIndex + 1;
    while (nextIndex < playlist.length && !playlist[nextIndex].found) {
      nextIndex++;
    }
    if (nextIndex < playlist.length) {
      playSong(nextIndex);
    } else {
      document.getElementById('playPauseBtn').textContent = '再生';
      document.getElementById('progressBar').style.width = '0%';
    }
  }


  // 前の曲へ
  function prevSong() {
    let prevIndex = currentIndex - 1;
    while (prevIndex >= 0 && !playlist[prevIndex].found) {
      prevIndex--;
    }
    if (prevIndex >= 0) {
      playSong(prevIndex);
    } else {
      // 最初の場合は頭出し
      audio.currentTime = 0;
      audio.play();
    }
  }
</script>


</body>
</html>
